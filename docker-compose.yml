services:
  redis:
    image: redis:alpine
    container_name: order-cache-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  order-cache-tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-cache-app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    entrypoint: ["/app/OrderCacheTest"]

  order-cache-benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: order-cache-bench
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    entrypoint: ["/app/OrderCacheBenchmark"]
    profiles:
      - benchmark