name: Cross-Platform CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    # --- Cache vcpkg assets/builds across runs ---
    - name: Restore vcpkg artifacts
      uses: actions/cache@v4
      with:
        path: |
          C:/vcpkg/installed
          C:/vcpkg/packages
          ~/.cache/vcpkg
        key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'CMakeLists.txt') }}
        restore-keys: |
          vcpkg-${{ matrix.os }}-

    # --- Install Dependencies per OS ---
    - name: Install Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtest-dev cmake
        cd /usr/src/googletest
        sudo cmake .
        sudo cmake --build . --target install

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install googletest

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        vcpkg install gtest:x64-windows

    # --- Build & Test ---
    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build Project
      run: cmake --build build --config Release

    - name: Run Google Tests
      run: ctest --test-dir build --output-on-failure