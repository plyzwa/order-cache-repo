name: Cross-Platform CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # Spin up Redis service container on Linux runners
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    # --- Cache vcpkg artifacts on Windows ---
    - name: Restore vcpkg artifacts
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: |
          C:/vcpkg/installed
          C:/vcpkg/packages
          ~/.cache/vcpkg
        key: vcpkg-windows-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          vcpkg-windows-

    # --- Install Dependencies per OS ---
    - name: Install Dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libgtest-dev \
          protobuf-compiler \
          libprotobuf-dev \
          libbenchmark-dev
        cd /usr/src/googletest
        sudo cmake .
        sudo cmake --build . --target install

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install googletest protobuf google-benchmark

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        vcpkg install gtest:x64-windows protobuf:x64-windows benchmark:x64-windows

    # --- Configure CMake ---
    - name: Configure CMake (Linux / macOS)
      if: runner.os != 'Windows'
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

    # --- Build Binaries ---
    - name: Build Project
      run: cmake --build build --config Release

    # --- Run Tests & Benchmarks ---
    - name: Run Tests (Linux)
      if: runner.os == 'Linux'
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      run: ctest --test-dir build --output-on-failure

    - name: Run Tests (macOS)
      if: runner.os == 'macOS'
      run: ctest --test-dir build --output-on-failure

    - name: Run Tests (Windows)
      if: runner.os == 'Windows'
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Run Benchmark Sanity Check (Linux)
      if: runner.os == 'Linux'
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      run: ./build/OrderCacheBenchmark --benchmark_filter="BM_OrderCreation|BM_Protobuf_Serialize|BM_FlatBuffers_ZeroCopyAccess"