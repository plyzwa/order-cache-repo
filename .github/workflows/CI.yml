name: Cross-Platform CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # ============================================================================
  # 1. Full Linux Suite with Live Redis Service Container
  # ============================================================================
  linux-build-and-test:
    name: Linux (Ubuntu + Redis Service)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libgtest-dev \
            protobuf-compiler \
            libprotobuf-dev \
            libbenchmark-dev
          cd /usr/src/googletest
          sudo cmake .
          sudo cmake --build . --target install

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build All Targets
        run: cmake --build build --config Release -j$(nproc)

      - name: Run Full Test Suite
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark Sanity Check
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: ./build/OrderCacheBenchmark --benchmark_filter="BM_OrderCreation|BM_Protobuf_Serialize|BM_FlatBuffers_ZeroCopyAccess|BM_Redis_Ping"

  # ============================================================================
  # 2. Multi-OS Matrix (macOS & Windows)
  # ============================================================================
  multi-os-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # --- Windows vcpkg Caching ---
      - name: Restore vcpkg Cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            ~/.cache/vcpkg
          key: vcpkg-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            vcpkg-windows-

      # --- Dependency Installation ---
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install googletest protobuf google-benchmark redis
          brew services start redis

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install gtest:x64-windows protobuf:x64-windows benchmark:x64-windows

      # --- CMake Configuration ---
      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      # --- Build ---
      - name: Build Project
        run: cmake --build build --config Release

      # --- Test Execution ---
      - name: Run Tests (macOS)
        if: runner.os == 'macOS'
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: ctest --test-dir build --output-on-failure

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure